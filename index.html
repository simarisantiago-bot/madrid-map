<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Madrid · Junio 2026</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <header class="sidebar__header">
      <h1>Madrid · Junio 2026</h1>
      <p class="sidebar__subtitle">Itinerario para mis tres días</p>
    </header>

    <div class="sidebar__search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="search" id="searchInput" placeholder="Buscar lugar…" autocomplete="off" />
      <button type="button" class="search-clear" id="searchClear" aria-label="Limpiar búsqueda">✕</button>
    </div>

    <div class="sidebar__filters" id="filters">
      <button class="filter-btn is-active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="Cultura">Cultura</button>
      <button class="filter-btn" data-filter="Restaurantes">Restaurantes</button>
      <button class="filter-btn" data-filter="Plazas y Calles">Plazas y Calles</button>
      <button class="filter-btn" data-filter="Compras">Compras</button>
      <button class="filter-btn" data-filter="Parques">Parques</button>
      <button class="filter-btn" data-filter="Alojamiento">Alojamiento</button>
    </div>

    <div class="sidebar__days" id="dayTabs">
      <button class="day-btn is-active" data-day="all">Todos los días</button>
      <button class="day-btn" data-day="1">Día 1</button>
      <button class="day-btn" data-day="2">Día 2</button>
      <button class="day-btn" data-day="3">Día 3</button>
      <button class="day-btn" data-day="otros">Otros</button>
    </div>

    <ul class="places-list" id="placesList"></ul>

    <footer class="sidebar__footer">
      <small>© OpenStreetMap · CARTO · Leaflet</small>
    </footer>
  </aside>

  <main id="map" class="map"></main>

  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Mostrar/ocultar barra lateral">
    <span></span><span></span><span></span>
  </button>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="script.js"></script>
</body>
</html>
